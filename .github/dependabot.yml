version: 2
# Tauri's Rust and JavaScript packages must move together. One weekly group
# also prevents a separate five-platform CI run for every small dependency bump.
multi-ecosystem-groups:
  maintenance:
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    patterns: ['*']
    multi-ecosystem-group: maintenance
    ignore:
      # Tauri's gtk 0.18 stack requires glib 0.18, so Dependabot's glib
      # update PRs can never satisfy Cargo. Drop this rule once Cargo.lock moves to
      # glib >= 0.20 (tauri adopting the gtk 0.20+ stack).
      - dependency-name: glib
  - package-ecosystem: npm
    directory: /
    patterns: ['*']
    multi-ecosystem-group: maintenance
  # The workflows run with release-signing secrets in scope; every action is
  # SHA-pinned, and this set keeps those pins moving forward instead of rotting.
  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: maintenance
