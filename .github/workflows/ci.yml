name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # ubuntu-24.04 is a migration canary: GitHub starts deprecating the 22.04 runner image on
    # 2026-09-17, so keep a leg proving the pipeline works there. Its failures do not block.
    # ubuntu-22.04 stays the release floor: linking against its glibc 2.35 keeps the AppImage
    # and .deb installable on every still-supported Ubuntu LTS.
    continue-on-error: ${{ matrix.os == 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, macos-latest, ubuntu-22.04, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dbus-tests \
            dbus-x11 \
            gnome-keyring \
            libayatana-appindicator3-dev \
            libsecret-tools \
            libwebkit2gtk-4.1-dev \
            openbox \
            librsvg2-dev \
            patchelf \
            weston \
            xdotool \
            xvfb

      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify application versions
        run: pnpm verify:versions

      - name: Verify frontend-backend command contract
        run: pnpm verify:contracts

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check

      - name: Test frontend
        run: pnpm test

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Test Windows Credential Manager integration
        if: runner.os == 'Windows'
        env:
          USAGEDECK_TEST_CREDENTIAL_STORE: '1'
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml
          providers::credential_store::tests::system_credential_store_round_trip_when_requested
          -- --exact --nocapture

      - name: Test macOS Keychain integration
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          original_keychain="$(security default-keychain -d user | tr -d '"')"
          test_keychain="${RUNNER_TEMP}/usagedeck-credential-test.keychain-db"
          cleanup() {
            security default-keychain -d user -s "${original_keychain}" || true
            security list-keychains -d user -s "${original_keychain}" || true
            security delete-keychain "${test_keychain}" || true
          }
          trap cleanup EXIT
          security create-keychain -p usagedeck-test "${test_keychain}"
          security set-keychain-settings -lut 21600 "${test_keychain}"
          security unlock-keychain -p usagedeck-test "${test_keychain}"
          security list-keychains -d user -s "${test_keychain}" "${original_keychain}"
          security default-keychain -d user -s "${test_keychain}"
          export USAGEDECK_TEST_CREDENTIAL_STORE=1
          cargo test --manifest-path src-tauri/Cargo.toml \
            providers::credential_store::tests::system_credential_store_round_trip_when_requested \
            -- --exact --nocapture

      - name: Test Linux Secret Service integration
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a dbus-run-session -- bash -euo pipefail -c '
            original_home="${HOME}"
            export RUSTUP_HOME="${RUSTUP_HOME:-${original_home}/.rustup}"
            export HOME="${RUNNER_TEMP}/usagedeck-secret-service-home"
            mkdir -p "${HOME}/.local/share/keyrings"
            eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets)"
            export USAGEDECK_TEST_CREDENTIAL_STORE=1
            cargo test --manifest-path src-tauri/Cargo.toml \
              providers::credential_store::tests::system_credential_store_round_trip_when_requested \
              -- --exact --nocapture
          '

      - name: Prepare Linux AppImage bundler
        if: runner.os == 'Linux'
        run: bash .github/scripts/setup-linuxdeploy.sh

      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: pnpm build:linux

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: pnpm tauri build --bundles dmg
        env:
          APPLE_SIGNING_IDENTITY: '-'

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: pnpm build:installer

      - name: Smoke test packaged application
        uses: ./.github/actions/platform-smoke

      - name: Upload Windows installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: UsageDeck-Windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows ARM64 installer
        if: matrix.os == 'windows-11-arm'
        uses: actions/upload-artifact@v7
        with:
          name: UsageDeck-Windows-ARM64-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: UsageDeck-macOS-DMG
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux AppImage
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v7
        with:
          name: UsageDeck-Linux-AppImage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux Debian package
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v7
        with:
          name: UsageDeck-Linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  # Runs the AppImage built on the ubuntu-22.04 floor inside stock distro containers to prove
  # the real glibc/library compatibility of shipped artifacts. GitHub hosts no RHEL-family
  # runners, so Rocky 9 stands in for RHEL/Alma/CentOS 9 — its glibc 2.34 is *older* than the
  # 22.04 build floor (2.35), which is exactly the boundary that decides whether dropping the
  # 22.04 build is safe. Canary failures do not block the build.
  distro-compat:
    name: distro-compat (${{ matrix.container }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        container: [rockylinux:9, debian:12, ubuntu:24.04]
    container: ${{ matrix.container }}
    steps:
      - name: Install display, session, and font dependencies
        run: |
          if command -v dnf >/dev/null 2>&1; then
            dnf install -y --setopt=install_weak_deps=False \
              xorg-x11-server-Xvfb dbus dbus-daemon fontconfig dejavu-sans-fonts
          else
            apt-get update
            apt-get install -y --no-install-recommends xvfb dbus libfontconfig1 xfonts-base
          fi

      - name: Download the AppImage
        uses: actions/download-artifact@v7
        with:
          name: UsageDeck-Linux-AppImage
          path: appimage

      - name: Run the AppImage and assert startup
        env:
          USAGEDECK_COMPAT_CONTAINER: ${{ matrix.container }}
        # Containers default to sh (dash), where `set -o pipefail` is not a thing.
        shell: bash
        run: |
          set -euo pipefail
          ldd --version | head -n 1 || true
          image="$(echo appimage/*.AppImage)"
          chmod +x "${image}"
          export HOME="${RUNNER_TEMP}/usagedeck-home"
          mkdir -p "${HOME}"

          # Surface every library the packaged binary expects from the system beyond what it
          # bundles, so a failure names the gap instead of only failing to load.
          "${image}" --appimage-extract >/dev/null 2>&1
          echo "System libraries the AppImage still expects:"
          ldd squashfs-root/usagedeck 2>/dev/null | grep "not found" || echo "(none missing)"

          Xvfb :99 -screen 0 1280x800x24 >"${RUNNER_TEMP}/xvfb.log" 2>&1 &
          export DISPLAY=:99
          export APPIMAGE_EXTRACT_AND_RUN=1
          dbus-run-session -- bash -euo pipefail -c '
            "${0}" >"${RUNNER_TEMP}/app-stdout.log" 2>&1 &
            app_pid=$!
            for attempt in $(seq 1 60); do
              if grep -Fq "UsageDeck startup completed" "${HOME}/.local/state/usagedeck/logs/UsageDeck.log" 2>/dev/null; then
                echo "UsageDeck started on ${USAGEDECK_COMPAT_CONTAINER}."
                kill "${app_pid}" 2>/dev/null || true
                exit 0
              fi
              sleep 1
            done
            echo "UsageDeck did not report startup within 60s on ${USAGEDECK_COMPAT_CONTAINER}; app output follows:"
            cat "${RUNNER_TEMP}/app-stdout.log" || true
            echo "Xvfb log follows:"
            cat "${RUNNER_TEMP}/xvfb.log" || true
            exit 1
          ' "${image}"
